<!DOCTYPE html>
<!--
  The published API reference: https://juusimaa.github.io/subscription-tracker

  This file is the whole page. It carries no API description of its own -- it
  loads openapi.json, which .github/workflows/docs.yml generates from the
  FastAPI app on every push to main. That is the point of doing it this way:
  the docstrings and Query descriptions in backend/app/main.py stay the single
  source of truth, and the published page cannot drift from the code the way a
  hand-maintained API document does.

  Redoc rather than Swagger UI, deliberately, even now that the API is live.
  Swagger UI's "Try it out" sends requests from this page's origin
  (juusimaa.github.io), and the production API's CORS_ORIGINS only allows the
  app's own frontend -- so every request would fail. The API already serves a
  working Swagger UI of its own at https://api.subscriptionstrack.com/docs,
  same origin, Authorize button and all; the link bar below points there for
  anyone who wants to send requests. This page stays the read-only reference.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subscription Tracker API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="HTTP API reference for the Subscription Tracker backend, generated from the FastAPI app."
    />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .ui-link {
        display: block;
        padding: 12px 24px;
        background: #201e1d;
        color: #fff;
        font: 14px/1.4 Arial, sans-serif;
      }
      .ui-link a { color: #ff9783; }
    </style>
  </head>
  <body>
    <div class="ui-link">
      Try requests against the live API in its
      <a href="https://api.subscriptionstrack.com/docs">interactive Swagger UI</a>,
      or explore the <a href="ui.html">clickable current UI mock</a>.
    </div>
    <!--
      The base URL shown against each endpoint comes from the `servers:` entry
      docs.yml adds to the spec, so it is the real production host.
    -->
    <redoc spec-url="openapi.json"></redoc>
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
