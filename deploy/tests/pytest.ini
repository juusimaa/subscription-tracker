# Test root for everything under deploy/: the production stack definition,
# deploy.sh's guard and ops-check.py's alert logic.
#
# A separate root, not a second testpaths entry in backend/pytest.ini, on
# purpose: the backend suite must keep running with a bare `pytest` from
# backend/ on a clean checkout, with nothing started and nothing installed but
# requirements-dev.txt (constitution Principle II). The edge tests here need
# Docker and build both images, which that promise rules out. Run them with:
#
#   pip install -r deploy/tests/requirements.txt
#   python -m pytest deploy/tests            # everything (needs Docker)
#   python -m pytest deploy/tests -m "not edge"   # the offline tests only
[pytest]
markers =
    edge: starts the production stack (Caddy + both images) in Docker; slow, needs a Docker daemon
