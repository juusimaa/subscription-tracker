# Alembic configuration. The migrations themselves live in alembic/versions/;
# this file only says where to find them and how to log.
#
#   alembic upgrade head     apply everything not yet applied
#   alembic downgrade -1     step back one revision
#   alembic current          which revision this database is on
#   alembic revision --autogenerate -m "..."   draft a migration from models.py
#
# Run from backend/. The backend container runs `upgrade head` itself on
# startup (see entrypoint.sh), so local Compose needs none of these by hand.

[alembic]
script_location = alembic

# Puts backend/ on sys.path so env.py can `from app import ...`, the same way
# pytest.ini's `pythonpath = .` does for the tests.
prepend_sys_path = .
# How prepend_sys_path is split into entries. "os" means the platform's own
# path separator; without it Alembic falls back to a legacy rule that also
# splits on spaces and colons, and warns about doing so.
path_separator = os

# Filenames get the revision id and the -m message: 0001_initial_schema.py
# rather than an opaque hash, so `ls alembic/versions` reads as a history.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately NOT set here. env.py reads DATABASE_URL
# instead -- the same variable the app itself uses -- so there is exactly one
# place a connection string is configured and no chance of migrations running
# against a different database than the one the app talks to.


# Logging. Without this block `alembic upgrade head` runs silently, which is
# the wrong default for something that runs on every container start.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
