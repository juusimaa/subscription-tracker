[pytest]
# `pytest` from the backend/ directory, with no arguments and no PYTHONPATH to
# remember, is the whole interface:
#
#   pip install -r requirements-dev.txt
#   pytest
#
# pythonpath puts backend/ on sys.path so `from app import ...` resolves the
# same way it does when uvicorn runs the app. Without it the imports work only
# by accident of where pytest was started from.
pythonpath = .
testpaths = tests

# Show the reason each test exists when one fails: these tests carry docstrings
# explaining the rule they protect, and -v alone hides them.
addopts = -q --strict-markers
