# Builds the backend and frontend images on every push to main and publishes
# them to GHCR (GitHub Container Registry), the image registry that comes
# bundled with the repo -- no Docker Hub account or external credentials
# needed.
#
# This workflow builds and publishes images, then rolls them out to the
# UpCloud server serving https://subscriptionstrack.com (deploy-upcloud job).
# Rollout is gated behind the UPCLOUD_DEPLOY_ENABLED repo variable (Settings
# > Secrets and variables > Actions > Variables), currently set to true -- so
# every push to main is a real, live deploy. Until the 2026-10-11 cutover
# (specs/001-upcloud-migration) a second job deployed to Azure Container
# Apps; it was removed when Azure was shut down.

name: Build and push images

on:
  push:
    branches: [main]
    # Don't burn a build on documentation-only commits. Any other path
    # (Dockerfiles, app code, this file itself) still triggers a run.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  # Adds a "Run workflow" button in the Actions tab, for rebuilding without
  # having to invent a commit.
  workflow_dispatch:

# Permissions granted to the automatic GITHUB_TOKEN for this workflow. The
# default is read-only, so pushing to GHCR needs packages:write to be asked
# for explicitly. Everything not listed here stays unavailable -- the token
# can publish images but can't, say, push commits.
permissions:
  contents: read
  packages: write

# If two pushes land close together, cancel the older run: only the newest
# commit's images are worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # One job definition, run twice in parallel -- once per image -- instead
    # of two near-identical copies. Each entry supplies the values that
    # differ: which folder to build from, what to call the image, and (for
    # the frontend) which Dockerfile stage to stop at.
    strategy:
      # Don't cancel the frontend build just because the backend one failed;
      # seeing both results is more useful than failing fast here.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ""
          - name: frontend
            context: ./frontend
            # The Dockerfile's default (last) stage is "production" anyway,
            # but naming it makes the intent explicit: this publishes the
            # Nginx image serving static files, never the Vite dev server
            # that docker-compose.yml targets for local development.
            target: production

    steps:
      # Checks the repo out into the runner's filesystem. Without this the
      # runner is an empty machine -- it doesn't have the code by default.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Buildx is Docker's extended builder. It's what makes the registry
      # cache used below available, and would also be what builds
      # multi-architecture images if this ever needs arm64 as well.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticates to GHCR using the token GitHub mints for this run.
      # It's scoped to this repository and expires when the run ends, so
      # there's no long-lived registry password stored as a secret.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the tags to publish. github.repository is
      # "owner/subscription-tracker", so the images become
      # ghcr.io/owner/subscription-tracker-backend and ...-frontend.
      # (This action lowercases the name for us -- registries reject
      # uppercase, while GitHub usernames allow it.)
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          # Two tags per build:
          #   latest         -- always the newest main build, convenient for
          #                     `docker pull` and for a first deploy.
          #   sha-<7 chars>  -- immutable, points at exactly one commit. This
          #                     is what a real deploy should pin to, since
          #                     "latest" silently changes underneath you and
          #                     makes rollbacks ambiguous.
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Every run starts on a brand-new runner with an empty Docker
          # cache, so without this each build would reinstall every pip and
          # npm dependency from scratch. These two lines store the layer
          # cache in GitHub Actions' own cache and reuse it next run, so
          # unchanged dependency layers are pulled instead of rebuilt --
          # the same caching that makes local rebuilds fast, persisted
          # between runs. mode=max caches intermediate build stages too,
          # which matters for the frontend's multi-stage build.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Rolls the just-published images out to the UpCloud server, live at
  # https://subscriptionstrack.com (and https://api.subscriptionstrack.com
  # for the backend). Gated behind UPCLOUD_DEPLOY_ENABLED so a fork or a
  # repo without the server and its deploy key can still run this workflow
  # -- the job is just skipped rather than failing. CI can't log in to that
  # server: the deploy key's authorized_keys line forces bin/deploy.sh, so
  # all this job can do is hand it a tag. deploy.sh pulls, restarts, checks /health
  # and rolls back on its own (specs/001-upcloud-migration/contracts/
  # deploy-interface.md); its exit code is this job's result.
  deploy-upcloud:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.UPCLOUD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    # One deploy at a time, and never cancel one halfway: deploy.sh also
    # takes a lock on the server, but a cancelled run could leave the job
    # red while the server finishes the deploy anyway.
    concurrency:
      group: upcloud-deploy
      cancel-in-progress: false

    # Nothing to publish or sign in to with GitHub's token -- the SSH key
    # below is the only credential this job uses.
    permissions:
      contents: read

    steps:
      # Same tag the build job just pushed, not `latest`.
      - name: Compute image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The host key is pinned from a secret (checked against the UpCloud
      # console when it was set), and StrictHostKeyChecking=yes refuses any
      # other key instead of trusting whatever answers on first connect.
      # Secrets go in through env, never interpolated into the script.
      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.UPCLOUD_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.UPCLOUD_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.UPCLOUD_KNOWN_HOSTS }}
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          umask 077
          key="$RUNNER_TEMP/deploy_key"
          known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$known"
          ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$known" \
            -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "$TAG"
