# Builds the backend and frontend images on every push to main and publishes
# them to GHCR (GitHub Container Registry), the image registry that comes
# bundled with the repo -- no Docker Hub account or external credentials
# needed.
#
# This workflow builds and publishes images, then -- once milestone 7's Azure
# infra exists -- rolls them out. Rollout is gated behind the
# AZURE_DEPLOY_ENABLED repo variable (Settings > Secrets and variables >
# Actions > Variables) so it stays a no-op until the Container Apps and
# federated credential in this file actually exist. Until then, flip it on
# and this becomes real push-to-main -> live deploy.

name: Build and push images

on:
  push:
    branches: [main]
    # Don't burn a build on documentation-only commits. Any other path
    # (Dockerfiles, app code, this file itself) still triggers a run.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  # Adds a "Run workflow" button in the Actions tab, for rebuilding without
  # having to invent a commit.
  workflow_dispatch:

# Permissions granted to the automatic GITHUB_TOKEN for this workflow. The
# default is read-only, so pushing to GHCR needs packages:write to be asked
# for explicitly. Everything not listed here stays unavailable -- the token
# can publish images but can't, say, push commits.
permissions:
  contents: read
  packages: write

# If two pushes land close together, cancel the older run: only the newest
# commit's images are worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # One job definition, run twice in parallel -- once per image -- instead
    # of two near-identical copies. Each entry supplies the values that
    # differ: which folder to build from, what to call the image, and (for
    # the frontend) which Dockerfile stage to stop at.
    strategy:
      # Don't cancel the frontend build just because the backend one failed;
      # seeing both results is more useful than failing fast here.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ""
          - name: frontend
            context: ./frontend
            # The Dockerfile's default (last) stage is "production" anyway,
            # but naming it makes the intent explicit: this publishes the
            # Nginx image serving static files, never the Vite dev server
            # that docker-compose.yml targets for local development.
            target: production

    steps:
      # Checks the repo out into the runner's filesystem. Without this the
      # runner is an empty machine -- it doesn't have the code by default.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Buildx is Docker's extended builder. It's what makes the registry
      # cache used below available, and would also be what builds
      # multi-architecture images if this ever needs arm64 as well.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticates to GHCR using the token GitHub mints for this run.
      # It's scoped to this repository and expires when the run ends, so
      # there's no long-lived registry password stored as a secret.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the tags to publish. github.repository is
      # "owner/subscription-tracker", so the images become
      # ghcr.io/owner/subscription-tracker-backend and ...-frontend.
      # (This action lowercases the name for us -- registries reject
      # uppercase, while GitHub usernames allow it.)
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          # Two tags per build:
          #   latest         -- always the newest main build, convenient for
          #                     `docker pull` and for a first Azure deploy.
          #   sha-<7 chars>  -- immutable, points at exactly one commit. This
          #                     is what a real deploy should pin to, since
          #                     "latest" silently changes underneath you and
          #                     makes rollbacks ambiguous.
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Every run starts on a brand-new runner with an empty Docker
          # cache, so without this each build would reinstall every pip and
          # npm dependency from scratch. These two lines store the layer
          # cache in GitHub Actions' own cache and reuse it next run, so
          # unchanged dependency layers are pulled instead of rebuilt --
          # the same caching that makes local rebuilds fast, persisted
          # between runs. mode=max caches intermediate build stages too,
          # which matters for the frontend's multi-stage build.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Rolls the just-published images out to Azure Container Apps. Sketched now,
  # switched on once milestone 7's infra (Container Apps Environment, the two
  # apps, the federated credential below) actually exists -- until then
  # AZURE_DEPLOY_ENABLED is unset, the `if:` is false, and this job is skipped
  # entirely rather than failing on infra that isn't there yet.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    # Deploys, unlike registry pushes, are worth doing one at a time -- if a
    # push landed while the previous deploy was still rolling out, finish
    # that one before starting the next rather than racing two `az`
    # invocations against the same Container Apps.
    concurrency:
      group: azure-deploy
      cancel-in-progress: false

    # No long-lived Azure credential stored as a secret. This exchanges the
    # run's short-lived OIDC token for an Azure login, via a federated
    # credential on an App Registration scoped to just this resource group --
    # set up once, in the Azure Portal, as part of milestone 7's infra work.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # docker/metadata-action's short-sha format is the first 7 characters
      # of the commit SHA -- computed the same way here so this points at
      # exactly the tag the build job above just pushed, not `latest`
      # (which, per the comment above, a real deploy shouldn't float on).
      - name: Compute image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `az containerapp update --image` points the app at a new image and
      # creates a new revision; Container Apps handles the traffic cutover.
      # Names/resource group here are placeholders for milestone 7's actual
      # infra names.
      - name: Update backend container app
        run: |
          az containerapp update \
            --name subscription-tracker-backend \
            --resource-group subscription-tracker-rg \
            --image ghcr.io/${{ github.repository }}-backend:${{ steps.tag.outputs.sha }}

      - name: Update frontend container app
        run: |
          az containerapp update \
            --name subscription-tracker-frontend \
            --resource-group subscription-tracker-rg \
            --image ghcr.io/${{ github.repository }}-frontend:${{ steps.tag.outputs.sha }}
