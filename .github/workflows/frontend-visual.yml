# Visual regression tests for the dashboard: screenshots the app against
# fixed fixture data (no backend, see frontend/tests/visual/mocks.js) and
# fails on any pixel diff against the committed baselines.
#
# Runs on pull requests so an intentional UI change is caught and its
# baselines reviewed before merge (see frontend/tests/visual/README.md), and
# also on push to main as a safety net for the gap a PR's checks can't see:
# main moving after this branch's last CI run and before merge, so the
# actual merged result was never itself tested. A push-triggered failure
# here can't block anything (it's already on main) but surfaces the drift
# immediately as a red check instead of it going unnoticed until the next
# unrelated PR's run.
#
# No `paths:` filter, on purpose: "visual" is a required status check on
# main (branch protection), and a required check a path filter prevents from
# ever running is one GitHub waits on forever instead of passing. The
# workflow always runs; the "changes" job below is what skips visual's
# actual work on a PR that doesn't touch frontend/, while still letting it
# report success.

name: Frontend visual tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split out from "visual" rather than a paths-filter step in that job: a
  # job-level `container:` (below) puts every step of that job inside the
  # Playwright image, which has no git history to diff against and isn't
  # guaranteed to have git installed at all. This one runs on the plain
  # runner instead, where the action's git-diff mode works normally.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "frontend/**"
              - ".github/workflows/frontend-visual.yml"

  visual:
    needs: changes
    runs-on: ubuntu-latest

    # The official Playwright image, not actions/setup-node + a separate
    # browser install: it's the same container the baselines are generated
    # in (see the README), which is what keeps font rendering identical
    # between "the image someone ran locally" and "the image CI runs" --
    # without that, this job would fail on font-antialiasing noise that has
    # nothing to do with the change under review. The tag has to track
    # @playwright/test's version in frontend/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@v7

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Run visual regression tests
        if: needs.changes.outputs.frontend == 'true'
        run: npx playwright test

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
