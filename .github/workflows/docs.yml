# Publishes the API reference to GitHub Pages:
# https://juusimaa.github.io/subscription-tracker
#
# The spec is *generated from the app*, never committed: this workflow imports
# backend/app/main.py, asks FastAPI for its OpenAPI document, and serves it to
# the Redoc page in docs/index.html. Nothing to regenerate by hand, and the
# published reference cannot drift from the routes it describes.
#
# One-time setup, which a workflow file cannot do for you: Settings -> Pages ->
# Source -> "GitHub Actions". Without that the deploy step fails with a 404.
# The repository also has to be public, unless the account has a plan that
# includes Pages for private repositories.

name: Publish API docs

on:
  push:
    branches: [main]
    # Only what can actually change the page. The route docstrings and Query
    # descriptions live in the backend, so backend changes are the main
    # trigger; README-only commits are not worth a deploy.
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  # A "Run workflow" button, for republishing without inventing a commit --
  # useful right after enabling Pages in the repository settings.
  workflow_dispatch:

# The three permissions the Pages deployment needs. pages:write publishes,
# id-token:write lets the deploy action prove to Pages that it is this
# workflow run (OIDC) rather than passing a long-lived token around.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages has one live deployment, so runs queue rather than race. Unlike the
# image build, in-progress runs are *not* cancelled: cancelling half way
# through a deployment is how a site ends up in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # 3.13 to match backend/Dockerfile -- the docs should be generated by
      # the same interpreter that runs the app, not a newer one that happens
      # to be on the runner.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Two environment variables, both throwaway:
      #
      #   DATABASE_URL  database.py builds an engine at import time, which needs
      #                 a URL it can parse. Nothing here connects -- migrations
      #                 own the schema now, so importing the app no longer
      #                 touches a database -- but in-memory SQLite keeps this
      #                 job independent of any real one either way.
      #   SECRET_KEY    auth.py refuses to import without one (deliberately --
      #                 see the comment there). Nothing signs a token in this
      #                 job, so any value does.
      #
      # Neither reaches the published page: the OpenAPI document describes the
      # routes, and holds no configuration.
      - name: Generate openapi.json
        working-directory: backend
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: "unused-by-this-job-nothing-here-signs-a-token"
        run: |
          mkdir -p ../_site
          python -c "
          import json
          from app.main import app
          with open('../_site/openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          "

      - name: Assemble the site
        run: cp docs/index.html _site/

      # Fails the run before publishing if the two halves don't line up: the
      # page is useless if the spec is missing or truncated, and a broken
      # deploy is harder to notice than a red build.
      - name: Check the spec is usable
        run: |
          python -c "
          import json
          spec = json.load(open('_site/openapi.json'))
          assert spec['paths'], 'spec has no paths'
          print(f\"{len(spec['paths'])} paths, {len(spec['components']['schemas'])} schemas\")
          "
          grep -q "openapi.json" _site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploying is a separate job on purpose: it is the only one holding the
  # Pages permissions and the github-pages environment, so nothing that builds
  # or runs project code can publish.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
