# Runs the backend test suite on every push and every pull request.
#
# Twice, against both databases the suite supports, because they are not the
# same database in the one way that matters here: Postgres returns a
# Numeric(10, 2) column as a Decimal, SQLite as a float. Postgres is what runs
# in production and is therefore the leg that must be green; SQLite is the
# zero-setup default a contributor gets from a bare `pytest`, and running it
# here is what keeps that path honest rather than quietly rotting.

name: Tests

# No `paths:` filter on these triggers, on purpose: both "sqlite" and
# "postgres" are required status checks on main (branch protection), and a
# required check that a path filter prevents from ever running is one GitHub
# waits on forever -- "Expected -- Waiting for status to be reported" blocks
# merging indefinitely instead of passing. The workflow now always runs; the
# paths-filter step below is what skips the actual work when backend/ didn't
# change, while still letting the job report success.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs are cancelled: only the newest commit's result is
# interesting, and a queue of stale runs makes the branch's real state harder
# to read rather than easier.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Both results are wanted. A Postgres-only failure is a genuinely
      # different bug from one that fails on both, and fail-fast would hide
      # which of the two happened.
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            # Empty, not absent: matrix values have to exist. conftest.py
            # treats an empty value as "not configured" and falls back to its
            # throwaway SQLite file -- the same thing a bare `pytest` does.
            test_database_url: ""
          - database: postgres
            # Reached over the mapped port on localhost: the steps run
            # directly on the runner, not inside the job's container network.
            test_database_url: postgresql+psycopg://postgres:postgres@localhost:5432/subscriptions_test

    name: ${{ matrix.database }}

    # Started for both legs -- a service cannot be declared per matrix leg --
    # and simply ignored by the SQLite one. postgres:16 matches
    # docker-compose.yml, so CI is not testing against a different major
    # version than local development uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # Created by the service itself, so no psql step is needed to make
          # the database the tests connect to.
          POSTGRES_DB: subscriptions_test
        ports:
          - 5432:5432
        # Without this the job races the database: the container is "started"
        # long before Postgres is accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Reports "backend" as changed whenever this workflow itself changes
      # too, so editing test.yml always exercises the thing it just edited.
      # push events compare against github.event.before, pull_request events
      # against the PR's merge base -- both handled by the action itself.
      - name: Check whether backend/ changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/test.yml"

      # 3.13 to match backend/Dockerfile: the tests should run on the
      # interpreter the app ships on, not whichever one the runner defaults to.
      - name: Set up Python
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt itself, so this one line
      # installs both the app and what tests it.
      - name: Install dependencies
        if: steps.filter.outputs.backend == 'true'
        run: pip install -r backend/requirements-dev.txt

      - name: Run the tests
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.test_database_url }}
        # No SECRET_KEY here on purpose: conftest.py sets a throwaway one if
        # the variable is absent, and a signing key in a workflow file is a
        # bad habit to build even when the value is meaningless.
        run: pytest

  # The production stack definition under deploy/ (specs/001-upcloud-migration):
  # the Compose file and Caddyfile must parse, the scripts must pass
  # shellcheck, and deploy/tests must pass -- including the edge tests, which
  # start the real Caddyfile in front of both images built from this commit
  # and check the rules the rate limits and maintenance mode depend on.
  #
  # Runs on every PR with no paths filter, for the same reason as the job
  # above: it is meant to become a required check, and it covers backend/ and
  # frontend/ changes too, since both images are built into the edge stack.
  deploy-config:
    name: deploy-config
    runs-on: ubuntu-latest
    # Building both images dominates; a hang shouldn't hold a runner for 6 h.
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # ENV_FILE points the backend's env_file at the dummy values instead of
      # /etc/subscription-tracker/.env, which only exists on the server;
      # --env-file supplies the same values for ${...} interpolation. The
      # path is relative to deploy/, the Compose project directory.
      - name: Validate the Compose file
        env:
          ENV_FILE: tests/sample.env
        run: docker compose -f deploy/compose.prod.yml --env-file deploy/tests/sample.env config -q

      # Validated as production runs it: sample.env leaves CADDY_TEST_GLOBALS
      # empty, so this is the Let's Encrypt configuration, not the test one.
      # Same pinned image as compose.prod.yml.
      - name: Validate the Caddyfile
        run: >-
          docker run --rm -v "$PWD/deploy:/deploy:ro" --env-file deploy/tests/sample.env
          caddy:2.11.7 caddy validate --config /deploy/Caddyfile --adapter caddyfile

      # Preinstalled on ubuntu-latest runners.
      - name: Lint the shell scripts
        run: shellcheck deploy/bin/*.sh

      # 3.12, not the app's 3.13: ops-check.py runs on the server's own
      # python3, and Ubuntu 24.04 ships 3.12.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r deploy/tests/requirements.txt

      # deploy/tests has its own pytest.ini (see there for why it is a
      # separate root from backend/).
      - name: Run the deploy tests
        run: python -m pytest deploy/tests -q
